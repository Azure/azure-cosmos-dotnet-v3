trigger: none

pr: none

variables:
  ReleaseArguments: ' --verbosity normal ' 
  BuildConfiguration: Release
  Packaging.EnableSBOMSigning: true
  VmImage: windows-latest # https://docs.microsoft.com/en-us/azure/devops/pipelines/agents/hosted?view=azure-devops 

stages:
- stage:
  displayName: Fault Injection Release Gates
  jobs:
    - template:  templates/static-tools.yml
      parameters:
        BuildConfiguration: '${{ variables.BuildConfiguration }}'
        VmImage: '${{ variables.VmImage }}'

    # Build + unit tests + pack validation, then the live multi-region
    # integration suite. The same template runs on every PR with
    # IncludeIntegration=false, so a Direct version bump is caught long before
    # this pipeline is triggered.
    - template:  templates/build-fault-injection.yml
      parameters:
        BuildConfiguration: '${{ variables.BuildConfiguration }}'
        Arguments: '${{ variables.ReleaseArguments }}'
        VmImage: '${{ variables.VmImage }}'
        IncludeIntegration: true
        MultiRegionConnectionString: $(COSMOSDB_MULTI_REGION)

- stage:
  displayName: Publish 
  jobs:
    - template:  templates/fault-injection-nuget-pack.yml
      parameters:
        BuildConfiguration: Release
        VmImage: '${{ variables.VmImage }}'
        ReleasePackage: true
        OutputPath: '$(Build.ArtifactStagingDirectory)/bin/AnyCPU/Release/Microsoft.Azure.Cosmos.FaultInjection'
        BlobVersion: $(BlobVersion)