# A pipeline with no CI trigger
trigger: none

pr:
  branches:
    include:
    - main
    - releases/*
  paths:
    include:
    - '*'
    exclude:
    - '*.md'
    - 'docs/**/*'
    - 'Microsoft.Azure.Cosmos/contracts/**/*'

variables:
  DebugArguments: ' --filter "TestCategory!=Flaky & TestCategory!=Quarantine & TestCategory!=Functional & TestCategory!=Ignore" --verbosity normal '
  ReleaseArguments: ' --filter "TestCategory!=Quarantine & TestCategory!=Ignore" --verbosity normal '
  VmImage: windows-latest # https://docs.microsoft.com/en-us/azure/devops/pipelines/agents/hosted?view=azure-devops


jobs:
- job: LinuxQueryPlanInterop
  displayName: Linux native query planning
  pool:
    vmImage: ubuntu-22.04
  steps:
  - task: UseDotNet@2
    inputs:
      packageType: runtime
      version: 6.x
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 8.x
  - task: DotNetCoreCLI@2
    displayName: Native query-plan ABI and routing tests
    inputs:
      command: test
      projects: Microsoft.Azure.Cosmos/tests/Microsoft.Azure.Cosmos.Tests/Microsoft.Azure.Cosmos.Tests.csproj
      arguments: '-c Release /p:OS=Linux --filter "FullyQualifiedName~QueryPlanInteropTests|FullyQualifiedName~QueryPartitionProviderTests|FullyQualifiedName~CosmosTargetsInteropPublishTests|FullyQualifiedName~QueryPlanBaselineTests|FullyQualifiedName~OptimisticDirectExecutionQueryBaselineTests|FullyQualifiedName~FullPipelineTests|FullyQualifiedName~PageSizeFactorForTopTests|FullyQualifiedName~QueryPlanRetrieverTests|FullyQualifiedName~PartitionRoutingHelperTest|FullyQualifiedName~SubpartitionTests|FullyQualifiedName~ClientDistributionPlanBaselineTests"'
      publishTestResults: true
    env:
      AZURE_COSMOS_USE_QUERY_INTEROP: 'true'
      AZURE_COSMOS_BYPASS_QUERY_PARSING: 'false'

- job: LinuxQueryPlanInteropLive
  displayName: Linux native query planning - live account
  timeoutInMinutes: 60
  condition: and(succeeded(), ne(variables['System.PullRequest.IsFork'], 'True'))
  pool:
    vmImage: ubuntu-22.04
  steps:
  - task: UseDotNet@2
    inputs:
      packageType: runtime
      version: 6.x
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 8.x
  - task: PowerShell@2
    displayName: Existing query regressions with Linux native planning
    inputs:
      pwsh: true
      targetType: inline
      script: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false

        if (-not [Runtime.InteropServices.RuntimeInformation]::IsOSPlatform([Runtime.InteropServices.OSPlatform]::Linux)) {
            throw 'This runner requires Linux.'
        }
        if ($env:AZURE_COSMOS_USE_QUERY_INTEROP -ne 'true' -or $env:AZURE_COSMOS_BYPASS_QUERY_PARSING -ne 'false') {
            throw 'Set AZURE_COSMOS_USE_QUERY_INTEROP=true and AZURE_COSMOS_BYPASS_QUERY_PARSING=false.'
        }
        if ([string]::IsNullOrWhiteSpace($env:COSMOSDB_ACCOUNT_CONNECTION_STRING)) {
            throw 'The existing COSMOSDB_ACCOUNT_CONNECTION_STRING CI secret is required; emulator fallback is not allowed.'
        }

        $connection = [System.Data.Common.DbConnectionStringBuilder]::new()
        try {
            $connection.set_ConnectionString($env:COSMOSDB_ACCOUNT_CONNECTION_STRING)
        }
        catch [ArgumentException] {
            throw 'COSMOSDB_ACCOUNT_CONNECTION_STRING is malformed.'
        }
        if (-not $connection.ContainsKey('AccountEndpoint') -or -not $connection.ContainsKey('AccountKey')) {
            throw 'COSMOSDB_ACCOUNT_CONNECTION_STRING must contain AccountEndpoint and AccountKey.'
        }
        $endpoint = $null
        if (-not [Uri]::TryCreate([string]$connection['AccountEndpoint'], [UriKind]::Absolute, [ref]$endpoint) -or
            $endpoint.Scheme -ne 'https' -or -not [string]::IsNullOrEmpty($endpoint.UserInfo) -or
            [string]::IsNullOrWhiteSpace([string]$connection['AccountKey'])) {
            throw 'COSMOSDB_ACCOUNT_CONNECTION_STRING must contain an HTTPS account endpoint and a nonempty key.'
        }

        function Assert-TestCount {
            param([string] $Path, [int] $Expected, [switch] $RequirePassed)
            [xml] $results = Get-Content -LiteralPath $Path -Raw
            $counters = $results.TestRun.ResultSummary.Counters
            if (-not $counters -or [int]$counters.total -ne $Expected -or [int]$counters.executed -ne $Expected) {
                throw "Expected exactly $Expected executed tests in $Path; missing or skipped tests are not accepted."
            }
            if ($RequirePassed -and [int]$counters.passed -ne $Expected) {
                throw "Native query-plan preflight did not pass. See $Path."
            }
        }

        $RepositoryRoot = (Resolve-Path -LiteralPath $env:BUILD_SOURCESDIRECTORY).Path
        $ResultsDirectory = Join-Path $env:AGENT_TEMPDIRECTORY 'LinuxQueryPlanInteropLive'
        $unitProject = Join-Path $RepositoryRoot 'Microsoft.Azure.Cosmos/tests/Microsoft.Azure.Cosmos.Tests/Microsoft.Azure.Cosmos.Tests.csproj'
        $liveProject = Join-Path $RepositoryRoot 'Microsoft.Azure.Cosmos/tests/Microsoft.Azure.Cosmos.EmulatorTests/Microsoft.Azure.Cosmos.EmulatorTests.csproj'
        $preflightResults = Join-Path $ResultsDirectory 'native-preflight'
        $liveResults = Join-Path $ResultsDirectory 'live'
        New-Item -ItemType Directory -Force -Path $preflightResults, $liveResults | Out-Null

        & dotnet test $unitProject -c Release /p:OS=Linux `
            --filter 'FullyQualifiedName=Microsoft.Azure.Cosmos.Tests.Query.QueryPlanInteropTests.AbsFilterTargetsBothSigns' `
            --results-directory $preflightResults --logger 'trx;LogFileName=native-preflight.trx' --verbosity minimal
        if ($LASTEXITCODE -ne 0) {
            throw 'The packaged Linux library could not generate the native preflight plan.'
        }
        Assert-TestCount -Path (Join-Path $preflightResults 'native-preflight.trx') -Expected 1 -RequirePassed

        & dotnet build $liveProject -c Release /p:OS=Linux --verbosity minimal
        if ($LASTEXITCODE -ne 0) {
            throw 'Building the live-test project failed.'
        }

        $settingsPath = Join-Path (Split-Path $liveProject) 'bin/Release/net6.0/settings.json'
        $originalSettings = [IO.File]::ReadAllBytes($settingsPath)
        $originalPermissions = [IO.File]::GetUnixFileMode($settingsPath)
        $settings = [Text.Encoding]::UTF8.GetString($originalSettings).TrimStart([char]0xFEFF) | ConvertFrom-Json -AsHashtable
        $settings.AppSettings.GatewayEndpoint = $endpoint.AbsoluteUri
        $settings.AppSettings.MasterKey = [string]$connection['AccountKey']
        [IO.File]::SetUnixFileMode($settingsPath, ([IO.UnixFileMode]::UserRead -bor [IO.UnixFileMode]::UserWrite))
        try {
            [IO.File]::WriteAllText($settingsPath, ($settings | ConvertTo-Json -Depth 20), [Text.UTF8Encoding]::new($false))
            & dotnet test $liveProject -c Release /p:OS=Linux --no-build --no-restore `
                --filter 'TestCategory=LinuxQueryPlanInteropLive' `
                --results-directory $liveResults --logger 'trx;LogFileName=linux-live.trx' --verbosity minimal `
                -- RunConfiguration.MaxCpuCount=1 MSTest.Parallelize.Workers=1
            $testExitCode = $LASTEXITCODE
            Assert-TestCount -Path (Join-Path $liveResults 'linux-live.trx') -Expected 7
            if ($testExitCode -ne 0) {
                throw 'Linux query-plan live regressions failed. See linux-live.trx; failures are not suppressed.'
            }
        }
        finally {
            [IO.File]::WriteAllBytes($settingsPath, $originalSettings)
            [IO.File]::SetUnixFileMode($settingsPath, $originalPermissions)
        }
    env:
      COSMOSDB_ACCOUNT_CONNECTION_STRING: $(COSMOSDB_ACCOUNT_CONNECTION_STRING)
      AZURE_COSMOS_USE_QUERY_INTEROP: 'true'
      AZURE_COSMOS_BYPASS_QUERY_PARSING: 'false'
      AZURE_COSMOS_OPTIMISTIC_DIRECT_EXECUTION_ENABLED: 'false'
  - task: PublishTestResults@2
    displayName: Publish Linux native/live test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '$(Agent.TempDirectory)/LinuxQueryPlanInteropLive/**/*.trx'
      testRunTitle: Linux QueryPlanInterop - native preflight and live regressions
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

- template:  templates/static-tools.yml
  parameters:
    BuildConfiguration: Release
    VmImage: $(VmImage)

- template:  templates/nuget-pack.yml
  parameters:
    BuildConfiguration: Release
    VmImage: $(VmImage)
    ReleasePackage: false
    OutputPath: '$(Build.ArtifactStagingDirectory)/bin/AnyCPU/Release/Microsoft.Azure.Cosmos'

- template:  templates/build-ctl.yml
  parameters:
    BuildConfiguration: Release
    Arguments: $(ReleaseArguments)
    VmImage: $(VmImage)

- template:  templates/build-samples.yml
  parameters:
    BuildConfiguration: Release
    Arguments: $(ReleaseArguments)
    VmImage: $(VmImage)

- template:  templates/build-test.yml
  parameters:
    BuildConfiguration: Release
    Arguments: $(ReleaseArguments)
    VmImage: $(VmImage)
    MultiRegionConnectionString: $(COSMOSDB_MULTI_REGION)
    MultiRegionMultiMasterConnectionString: $(COSMOSDB_MULTIMASTER)
    IncludePerformance: true
    IncludeCoverage: true

- template:  templates/build-internal.yml
  parameters:
    BuildConfiguration: Release
    Arguments: $(ReleaseArguments)
    VmImage:  $(VmImage)

- template:  templates/build-preview.yml
  parameters:
    BuildConfiguration: Release
    Arguments: $(ReleaseArguments)
    VmImage:  $(VmImage)

- template:  templates/build-benchmark.yml
  parameters:
    BuildConfiguration: Release
    Arguments: $(ReleaseArguments)
    VmImage:  $(VmImage)

# FaultInjection compiles against Microsoft.Azure.Cosmos.Direct internals, so a
# $(DirectVersion) bump can break it while the main SDK still builds. Keep this
# gate on the PR pipeline; the live-account tests stay in the release pipeline.
- template:  templates/build-fault-injection.yml
  parameters:
    BuildConfiguration: Release
    Arguments: $(ReleaseArguments)
    VmImage:  $(VmImage)
    IncludeIntegration: false
    
- template:  templates/build-thinclient.yml
  parameters:
    BuildConfiguration: Release
    Arguments: $(ReleaseArguments)
    VmImage: $(VmImage)
    ThinClientConnectionString: $(COSMOSDB_THINCLIENT)
    ThinClientStrongConsistencyString: $(COSMOSDB_THINCLIENTSTRONG)
    MultiRegionConnectionString: $(COSMOSDB_MULTI_REGION)
    IncludePerformance: true
    IncludeCoverage: true

# Live-account AAD (Microsoft Entra ID) integration tests (TestCategory=MultiRegionAad).
# These run on every pipeline (PR + nightly), targeting the AAD-only live Cosmos DB account
# dotnet-v3-multiregion via an Azure Resource Manager (Workload Identity Federation) service
# connection whose app-registration identity (co-tenant with the account) holds the Cosmos DB
# data-plane role. The job stays skipped (green) if 'AadServiceConnection' is cleared.
- template:  templates/build-test-aad.yml
  parameters:
    BuildConfiguration: Release
    AadAccountEndpoint: 'https://dotnet-v3-multiregion.documents.azure.com:443/'
    AadServiceConnection: 'dotnet-v3-aad-ci'