# Report the Linux environment and require native-planning flags.

steps:
- bash: |
    set -euo pipefail
    . /etc/os-release
    echo "OS:            ${PRETTY_NAME}"
    echo "Kernel/arch:   $(uname -srm)"
    echo "glibc:         $(ldd --version | head -n 1)"
    echo "CPU count:     $(nproc)"
    dotnet --list-sdks
    dotnet --list-runtimes
    if [ "${AZURE_COSMOS_USE_QUERY_INTEROP:-}" != "true" ] || [ "${AZURE_COSMOS_BYPASS_QUERY_PARSING:-}" != "false" ]; then
      echo "##vso[task.logissue type=error]Set AZURE_COSMOS_USE_QUERY_INTEROP=true and AZURE_COSMOS_BYPASS_QUERY_PARSING=false."
      exit 1
    fi
  displayName: Linux environment and query-interop flags
