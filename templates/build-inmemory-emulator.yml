# Shared by PR, nightly, and focused manually queued SDK pipelines.
parameters:
  BuildConfiguration: Release
  VmImage: ubuntu-24.04

jobs:
- job: InMemoryEmulatorTests
  displayName: SDK in-memory emulator tests ${{ parameters.BuildConfiguration }}
  timeoutInMinutes: 30
  pool:
    vmImage: ${{ parameters.VmImage }}
  variables:
    EmulatorSourceRevision: '13b9707cf9a73d274c6e2309321d4b0e92b52375'
    EmulatorRustVersion: '1.95.0'
    EmulatorCargoHome: '$(Agent.TempDirectory)/cosmos-emulator-cargo'
    EmulatorTarget: '$(Agent.TempDirectory)/cosmos-emulator-target'
    EmulatorResults: '$(Agent.TempDirectory)/inmemory-results'
    TestProject: 'Microsoft.Azure.Cosmos/tests/Microsoft.Azure.Cosmos.InMemoryEmulatorTests/Microsoft.Azure.Cosmos.InMemoryEmulatorTests.csproj'

  steps:
  - checkout: self
    clean: true

  - task: UseDotNet@2
    displayName: Use .NET 6.0 runtime
    inputs:
      packageType: runtime
      version: '6.x'

  - task: UseDotNet@2
    displayName: Use .NET 8.0 SDK
    inputs:
      packageType: sdk
      version: '8.x'

  - bash: |
      set -euo pipefail
      export PATH="$HOME/.cargo/bin:$PATH"
      command -v rustup
      rustup toolchain install "$(EmulatorRustVersion)" --profile minimal
      echo "##vso[task.prependpath]$HOME/.cargo/bin"
      source="$(Agent.TempDirectory)/cosmos-emulator-source"
      git init --quiet "$source"
      git -C "$source" fetch --depth=1 https://github.com/Azure/azure-sdk-for-rust.git \
        "$(EmulatorSourceRevision)"
      git -C "$source" checkout --detach FETCH_HEAD
      test "$(git -C "$source" rev-parse HEAD)" = "$(EmulatorSourceRevision)"
      mkdir -p "$(EmulatorCargoHome)" "$(EmulatorResults)"
      cp "$source/eng/templates/config.toml.template" "$(EmulatorCargoHome)/config.toml"
    displayName: Prepare pinned Rust source and Cargo feed

  - task: NuGetAuthenticate@1
    displayName: Acquire the Azure Artifacts endpoint token

  # Match Go v2's public/fork endpoint-token workaround. Never fall back to
  # crates.io or an unauthenticated registry if this feed cannot be read.
  - task: CargoAuthenticate@0
    displayName: Authenticate the Azure SDK Rust feed
    inputs:
      configFile: '$(EmulatorCargoHome)/config.toml'
    env:
      SYSTEM_ACCESSTOKEN: $(VSS_NUGET_ACCESSTOKEN)

  - bash: |
      set -euo pipefail
      cd "$(Agent.TempDirectory)/cosmos-emulator-source"
      cargo +"$(EmulatorRustVersion)" build --locked --release \
        -p azure_data_cosmos_emulator --target-dir "$(EmulatorTarget)" \
        2>&1 | tee "$(EmulatorResults)/emulator-build.log"
      test -x "$(EmulatorTarget)/release/azure_data_cosmos_emulator"
    displayName: Build the in-memory emulator
    env:
      CARGO_HOME: $(EmulatorCargoHome)

  - bash: |
      set -euo pipefail
      test -x "$COSMOS_IN_MEMORY_EMULATOR_PATH"
      dotnet test "$(TestProject)" --configuration "${{ parameters.BuildConfiguration }}" \
        --logger "console;verbosity=normal" --logger "trx;LogFileName=inmemory.trx" \
        --results-directory "$(EmulatorResults)"
      python3 - <<'PY'
      import xml.etree.ElementTree as ET
      root = ET.parse("$(EmulatorResults)/inmemory.trx").getroot()
      ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
      results = root.findall(".//t:UnitTestResult", ns)
      if not results or any(r.attrib["outcome"] != "Passed" for r in results):
          raise SystemExit("In-memory emulator tests failed, were skipped, or did not run")
      host_tests = {
          t.attrib["id"]
          for t in root.findall(".//t:UnitTest", ns)
          if t.find("t:TestMethod", ns).attrib["className"].split(",")[0].endswith(".ItemTests")
      }
      executed_host_tests = {r.attrib["testId"] for r in results} & host_tests
      if not executed_host_tests or executed_host_tests != host_tests:
          raise SystemExit("The process-backed emulator tests did not all execute")
      print(f"Verified {len(results)} passing tests, including {len(executed_host_tests)} process-backed tests")
      PY
    displayName: Run SDK tests (process-backed tests required; no skips)
    env:
      COSMOS_IN_MEMORY_EMULATOR_PATH: '$(EmulatorTarget)/release/azure_data_cosmos_emulator'

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '$(EmulatorResults)/*.trx'
      testRunTitle: Cosmos in-memory emulator ${{ parameters.BuildConfiguration }}
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - task: PublishBuildArtifacts@1
    displayName: Publish emulator build and test diagnostics
    condition: and(succeededOrFailed(), ne(variables['Agent.JobStatus'], 'Canceled'))
    inputs:
      PathtoPublish: '$(EmulatorResults)'
      ArtifactName: 'inmemory-emulator-results'
      publishLocation: Container
